name: Build Watcher

on:
        push:
        workflow_dispatch:

jobs:
        build:
                runs-on: windows-latest

                steps:
                        -
                                name: Checkout repository
                                uses: actions/checkout@v4

                        -
                                name: Set up Python
                                uses: actions/setup-python@v5
                                with:
                                        python-version: "3.11"

                        -
                                name: Install Python dependencies
                                run: |
                                        python -m pip install --upgrade pip
                                        pip install requests pytesseract mss pillow keyboard pyinstaller

                        -
                                name: Install Tesseract OCR
                                shell: powershell
                                run: |
                                        choco install tesseract -y

                        -
                                name: Prepare Tesseract files
                                shell: powershell
                                run: |
                                        New-Item -ItemType Directory -Force -Path "tesseract"
                                        Copy-Item "C:\Program Files\Tesseract-OCR\tesseract.exe" "tesseract\tesseract.exe"
                                        Copy-Item "C:\Program Files\Tesseract-OCR\*.dll" "tesseract\"
                                        Copy-Item "C:\Program Files\Tesseract-OCR\tessdata" "tesseract\tessdata" -Recurse

                        -
                                name: Build Watcher
                                run: |
                                        pyinstaller watcher.spec

                        -
                                name: Upload Watcher
                                uses: actions/upload-artifact@v4
                                with:
                                        name: watcher-build
                                        path: dist/watcher/