name: Build Watcher

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytesseract mss pillow keyboard pyinstaller

      - name: Install Tesseract OCR
        shell: powershell
        run: |
          choco install tesseract -y

      - name: Prepare Tesseract
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "tesseract"
          New-Item -ItemType Directory -Force -Path "tesseract\tessdata"

          Copy-Item `
            "C:\Program Files\Tesseract-OCR\tesseract.exe" `
            "tesseract\tesseract.exe"

          Copy-Item `
            "C:\Program Files\Tesseract-OCR\*.dll" `
            "tesseract\"

          Copy-Item `
            "C:\Program Files\Tesseract-OCR\tessdata\eng.traineddata" `
            "tesseract\tessdata\eng.traineddata"

      - name: Test Tesseract
        shell: powershell
        run: |
          & "tesseract\tesseract.exe" --version

          if (-not (Test-Path "tesseract\tessdata\eng.traineddata")) {
            Write-Error "eng.traineddata was not found."
            exit 1
          }

      - name: Test Python dependencies
        shell: powershell
        run: |
          python -c "import mss; import pytesseract; import PIL; import keyboard; print('Watcher dependencies OK')"

      - name: Build Watcher
        shell: powershell
        run: |
          pyinstaller --clean watcher.spec

      - name: Verify build
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "        WATCHER BUILD OUTPUT"
          Write-Host "=========================================="
          Write-Host ""

          if (-not (Test-Path "dist")) {
            Write-Error "PyInstaller did not create the dist folder."
            exit 1
          }

          Get-ChildItem "dist" -Recurse -Force

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "             BUILD SIZE"
          Write-Host "=========================================="

          $files = Get-ChildItem "dist" -Recurse -File

          if ($files.Count -eq 0) {
            Write-Error "The dist folder is empty."
            exit 1
          }

          $size = ($files | Measure-Object -Property Length -Sum).Sum

          Write-Host "$([math]::Round($size / 1MB, 2)) MB"

      - name: Upload Watcher
        uses: actions/upload-artifact@v4
        with:
          name: watcher-build
          path: dist/**
          if-no-files-found: error
