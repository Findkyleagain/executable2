name: Build Watcher

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytesseract mss pillow keyboard pyinstaller

      - name: Install Tesseract OCR
        shell: powershell
        run: |
          choco install tesseract -y

      - name: Prepare Tesseract files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "tesseract"
          New-Item -ItemType Directory -Force -Path "tesseract\tessdata"

          Copy-Item "C:\Program Files\Tesseract-OCR\tesseract.exe" "tesseract\tesseract.exe"
          Copy-Item "C:\Program Files\Tesseract-OCR\*.dll" "tesseract\"
          Copy-Item "C:\Program Files\Tesseract-OCR\tessdata\eng.traineddata" "tesseract\tessdata\eng.traineddata"

      - name: Test Tesseract
        shell: powershell
        run: |
          & "tesseract\tesseract.exe" --version

          if (-not (Test-Path "tesseract\tessdata\eng.traineddata")) {
              Write-Error "English Tesseract data was not found."
              exit 1
          }

      - name: Test Watcher imports
        shell: powershell
        run: |
          python -c "import mss; import pytesseract; import PIL; import keyboard; print('Watcher dependencies OK')"

      - name: Build Watcher
        run: |
          pyinstaller --clean watcher.spec

      - name: Verify build
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "        WATCHER BUILD OUTPUT"
          Write-Host "=========================================="
          Write-Host ""

          if (Test-Path "dist") {
              Get-ChildItem "dist" -Recurse -Force

              Write-Host ""
              Write-Host "Build size:"

              $size = (
                  Get-ChildItem "dist" -Recurse -File |
                  Measure-Object -Property Length -Sum
              ).Sum

              Write-Host "$([math]::Round($size / 1MB, 2)) MB"
          }
          else {
              Write-Error "dist folder was not created."
              exit 1
          }

      - name: Upload Watcher
        uses: actions/upload-artifact@v4
        with:
          name: watcher-build
          path: dist/**
          if-no-files-found: error
